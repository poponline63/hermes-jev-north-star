name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: every claim in the README, asserted
        run: python scripts/smoke_test.py
      - name: the shipped example star is drivable
        run: python scripts/north_star.py check --file templates/star.example.json
